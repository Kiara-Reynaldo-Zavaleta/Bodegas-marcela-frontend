<div class="dialog-overlay" (click)="alClicOverlay($event)">
  <div
    class="dialog-card"
    [class.dialog-card--sm]="tamano() === 'sm'"
    appModalShell
    (escape)="cerrar.emit()"
    [attr.aria-labelledby]="tituloId"
  >
    <div class="dialog-header">
      <h2 class="dialog-title" [id]="tituloId">{{ titulo() }}</h2>
      <button type="button" class="dialog-close" (click)="cerrar.emit()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="dialog-body">
      <ng-content />
    </div>
  </div>
</div>
